[project]
name = "forgetting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yangxiaobin", email = "yangxiaobinn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "datasets==3.6.0",
    "accelerate==1.10.1",
    "lm-eval==0.4.9",
    "matplotlib==3.10.7",
    "modelscope==1.40.3",
    "socksio>=1.0.0",
]


[project.scripts]
forgetting = "forgetting:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
